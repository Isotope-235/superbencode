[package]
name = "superbencode"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

categories = ["parser-implementations", "encoding"]
keywords = ["bencode", "bencoding"]

[dev-dependencies]
bendy = "0.6.1"
criterion = { version = "0.8", features = ["html_reports"] }
serde_bencode = "0.2.4"

[lints.clippy]
pedantic = "warn"

[[bench]]
name = "file"
harness = false

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "compare"
harness = false
